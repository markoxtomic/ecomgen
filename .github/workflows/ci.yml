name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]" build
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest --cov=ecomgen --cov-report=term-missing
      - name: Build package
        run: python -m build
      - name: Smoke generate
        working-directory: ${{ runner.temp }}
        run: ecomgen generate --customers 10 --months 1 --seed 42 --out ecomgen-smoke
      - name: Smoke validate
        working-directory: ${{ runner.temp }}
        run: ecomgen validate --path ecomgen-smoke
