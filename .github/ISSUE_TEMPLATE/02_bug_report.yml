name: Bug report
description: A crash, a wrong error message, or a command that does not behave as documented
labels: ["bug"]
body:
  - type: input
    id: command
    attributes:
      label: Exact command
      placeholder: ecomgen generate --customers 50000 --months 36 --out ./out
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Paste the full output or traceback. Exit status is useful too.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ecomgen version
      description: "`python -c \"import ecomgen; print(ecomgen.__version__)\"`, or the commit SHA."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["Linux", "macOS", "Windows", "Other"]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.14.7"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I am on a supported Python (3.11 or newer).
          required: true
        - label: The output directory was new, empty, or an earlier ecomgen export.
          required: false
